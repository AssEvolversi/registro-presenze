<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Presenze</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Eventuali stili personalizzati extra */
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Header / Barra di stato -->
  <header class="bg-white shadow-sm border-b border-gray-100 p-4 flex justify-between items-center">
    <h1 class="font-bold text-lg text-blue-600 flex items-center gap-2">
      <i class="fa-solid fa-clipboard-user"></i> Gestione Presenze
    </h1>
    <div id="statoConnessione" class="flex items-center gap-2 text-xs text-gray-500">
      <span id="puntoStato" class="w-2.5 h-2.5 rounded-full inline-block bg-green-400 shadow-sm"></span>
      <span id="testoStato">Pronto</span>
    </div>
  </header>

  <!-- Contenitore Principale -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4">

    <!-- Schermata Home / Selezione Sedi -->
    <section id="schermataHome" class="space-y-4">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="text-xl font-bold mb-4">Seleziona Sede / Servizio</h2>
        <div id="grigliaSedi" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <!-- Le card delle sedi verranno generate qui dinamicamente -->
        </div>
      </div>
    </section>

    <!-- Wrapper Registro (nascosto di default) -->
    <section id="wrapperRegistro" class="hidden space-y-4">
      <button onclick="tornaAllaHome()" class="text-blue-600 text-sm font-medium flex items-center gap-1 mb-2">
        <i class="fa-solid fa-arrow-left"></i> Torna alla selezione
      </button>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <h3 id="titoloRegistro" class="text-lg font-bold mb-4">Registro</h3>
        <!-- Contenuto del registro -->
      </div>
    </section>

    <!-- Wrapper Timbratura (nascosto di default) -->
    <section id="wrapperTimbratura" class="hidden space-y-4">
      <button onclick="tornaAllaHome()" class="text-blue-600 text-sm font-medium flex items-center gap-1 mb-2">
        <i class="fa-solid fa-arrow-left"></i> Torna alla selezione
      </button>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <h3 class="text-lg font-bold mb-4">Timbratura</h3>
        <!-- Contenuto timbratura -->
      </div>
    </section>

  </main>

  <!-- Blocco JavaScript -->
  <script>
    // INSERISCI QUI IL TUO URL DI GOOGLE APPS SCRIPT
    const URL_WEB_APP = "INCOLLA_QUI_IL_ TUO_URL_APPS_SCRIPT";

    // Funzione centralizzata per le chiamate al backend
    function chiamaBackend(azione, payload = {}) {
      aggiornaStatoSalvataggio('salvataggio', 'Sincronizzazione...');
      
      const datiInvio = {
        azione: azione,
        ...payload
      };

      return fetch(URL_WEB_APP, {
        method: 'POST',
        mode: 'no-cors', // O gestisci CORS a seconda di come è configurato il tuo script
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify(datiInvio)
      })
      .then(response => {
        aggiornaStatoSalvataggio('pronto', 'Aggiornato');
        return response.json().catch(() => ({ success: true }));
      })
      .catch(error => {
        aggiornaStatoSalvataggio('errore', 'Errore di connessione');
        console.error("Errore backend:", error);
        throw error;
      });
    }

    function aggiornaStatoSalvataggio(stato, messaggio) {
      var punto = document.getElementById('puntoStato');
      var testo = document.getElementById('testoStato');
      var coloreBg = "bg-green-400";
      
      if (stato === 'salvataggio') coloreBg = "bg-yellow-400 animate-pulse";
      if (stato === 'errore') coloreBg = "bg-red-400";

      if (punto) punto.className = `w-2.5 h-2.5 rounded-full inline-block shadow-sm ${coloreBg}`;
      if (testo) testo.innerText = messaggio;
    }

    function tornaAllaHome() {
      var home = document.getElementById('schermataHome');
      var reg = document.getElementById('wrapperRegistro');
      var timb = document.getElementById('wrapperTimbratura');

      if (home) home.classList.remove('hidden');
      if (reg) reg.classList.add('hidden');
      if (timb) timb.classList.add('hidden');
    }

    // Aggiungi qui sotto il resto delle tue funzioni (caricaSedi, selezionaServizio, ecc.)
    
    document.addEventListener("DOMContentLoaded", function() {
      console.log("App avviata correttamente");
      // Esegui qui le chiamate iniziali se necessarie
    });
  </script>
</body>
</html>
