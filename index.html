<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Associazione Evolversi</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: radial-gradient(circle at top center, #f8fafc 0%, #e2e8f0 100%);
    }
    .card-3d {
      background: linear-gradient(145deg, #ffffff, #f1f5f9);
      box-shadow: 10px 10px 20px #cbd5e1, -10px -10px 20px #ffffff, inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-3d:hover {
      transform: translateY(-4px);
      box-shadow: 15px 15px 30px #cbd5e1, -15px -15px 30px #ffffff, inset 0 1px 0 rgba(255, 255, 255, 1);
    }
    .card-3d:active {
      transform: translateY(-1px);
      box-shadow: 5px 5px 10px #cbd5e1, -5px -5px 10px #ffffff;
    }
    .header-3d {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.3);
    }
    .btn-icon-3d {
      background: linear-gradient(145deg, #eff6ff, #dbeafe);
      box-shadow: 5px 5px 10px #bfdbfe, -5px -5px 10px #ffffff;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header Blu Moderno e Tridimensionale -->
  <header class="header-3d text-white p-5 flex justify-between items-center sticky top-0 z-50 backdrop-blur-md border-b border-blue-500/20">
    <div class="flex items-center gap-3">
      <img src="https://lh3.googleusercontent.com/d/1U3wZDb34MJyIGitW-ZEmgd5cRBDorTG3=s220" alt="Logo Evolversi" class="w-10 h-10 object-contain rounded-full bg-white/10 p-1 shadow-inner">
      <span class="font-black text-lg tracking-wider drop-shadow-sm">ASSOCIAZIONE EVOLVERSI</span>
    </div>
    <div class="flex items-center gap-4 text-xl">
      <a href="#" target="_blank" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition shadow-inner" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
      <a href="#" target="_blank" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition shadow-inner" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
    </div>
  </header>

  <!-- Indicatore di stato -->
  <div class="max-w-4xl w-full mx-auto px-4 pt-3 flex justify-end items-center text-xs text-slate-500">
    <div id="statoConnessione" class="flex items-center gap-2 bg-white/80 backdrop-blur px-3 py-1 rounded-full shadow-sm border border-slate-200/60">
      <span id="puntoStato" class="w-2.5 h-2.5 rounded-full inline-block bg-emerald-400 shadow-sm"></span>
      <span id="testoStato" class="font-medium">Pronto</span>
    </div>
  </div>

  <!-- Contenitore Principale -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-center">

    <!-- Schermata Home -->
    <section id="schermataHome" class="space-y-6 py-6">
      <div class="text-center mb-10">
        <h2 class="text-3xl font-black text-slate-900 tracking-tight drop-shadow-sm">Gestione Attività</h2>
        <p class="text-slate-500 text-sm mt-1">Seleziona una sezione per accedere ai servizi</p>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-2xl mx-auto w-full">
        <button onclick="apriRegistroPresenze()" class="card-3d p-8 rounded-3xl flex flex-col items-center justify-center gap-5 text-center group cursor-pointer border border-white/50">
          <div class="w-20 h-20 btn-icon-3d text-blue-600 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition duration-300">
            <i class="fa-solid fa-clipboard-user"></i>
          </div>
          <div>
            <span class="text-xl font-bold text-slate-800 block group-hover:text-blue-600 transition">Registro Presenze</span>
            <span class="text-xs text-slate-400 font-medium">Seleziona sede o servizio</span>
          </div>
        </button>

        <button onclick="mostraSezione('wrapperTimbratura')" class="card-3d p-8 rounded-3xl flex flex-col items-center justify-center gap-5 text-center group cursor-pointer border border-white/50">
          <div class="w-20 h-20 btn-icon-3d text-emerald-600 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition duration-300">
            <i class="fa-solid fa-clock"></i>
          </div>
          <div>
            <span class="text-xl font-bold text-slate-800 block group-hover:text-emerald-600 transition">Timbrature</span>
            <span class="text-xs text-slate-400 font-medium">Registrazione ingressi e uscite</span>
          </div>
        </button>
      </div>
    </section>

    <!-- Wrapper Registro Presenze -->
    <section id="wrapperRegistro" class="hidden space-y-4">
      <button onclick="tornaAllaHome()" class="text-blue-600 text-sm font-semibold flex items-center gap-2 mb-2 hover:translate-x-[-4px] transition transform cursor-pointer">
        <i class="fa-solid fa-arrow-left"></i> Torna alla home
      </button>
      <div class="card-3d p-6 sm:p-8 rounded-3xl border border-white/50">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-xl font-black text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-building text-blue-600"></i> Seleziona Sede o Servizio
          </h3>
          <button onclick="caricaSediPresenze()" class="text-xs text-blue-600 hover:underline font-medium flex items-center gap-1">
            <i class="fa-solid fa-rotate"></i> Aggiorna
          </button>
        </div>
        <div id="grigliaSediPresenze" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="col-span-full text-center py-8 text-slate-400 text-sm">
            <i class="fa-solid fa-spinner animate-spin text-blue-600 text-lg mr-2"></i> Caricamento servizi in corso...
          </div>
        </div>
      </div>
    </section>

    <!-- Wrapper Sede Specifica -->
    <section id="wrapperSedeSpecifica" class="hidden space-y-4">
      <div class="flex justify-between items-center mb-2">
        <button onclick="apriRegistroPresenze()" class="text-blue-600 text-sm font-semibold flex items-center gap-2 hover:translate-x-[-4px] transition transform cursor-pointer">
          <i class="fa-solid fa-arrow-left"></i> Torna alla scelta sedi
        </button>
        <button onclick="ricaricaIscrittiCorrenti()" class="text-xs text-blue-600 hover:underline font-medium flex items-center gap-1">
          <i class="fa-solid fa-rotate"></i> Sincronizza iscritti
        </button>
      </div>
      
      <div class="card-3d p-6 sm:p-8 rounded-3xl border border-white/50 space-y-5">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <h3 id="titoloSedeSelezionata" class="text-xl font-black text-blue-600 flex items-center gap-2">
            <i class="fa-solid fa-clipboard-list"></i> Registro Presenze
          </h3>
          <span id="dataOdiernaBadge" class="text-xs bg-blue-50 text-blue-600 font-bold px-3 py-1 rounded-full w-fit">Data odierna</span>
        </div>

        <!-- Barra di Riepilogo -->
        <div class="grid grid-cols-3 gap-3 text-center">
          <div class="bg-emerald-50 border border-emerald-200/60 p-3 rounded-2xl shadow-inner">
            <span class="block text-xs font-bold text-emerald-600 uppercase tracking-wide">Presenti</span>
            <span id="statPresenti" class="text-xl font-black text-emerald-700">0</span>
          </div>
          <div class="bg-rose-50 border border-rose-200/60 p-3 rounded-2xl shadow-inner">
            <span class="block text-xs font-bold text-rose-600 uppercase tracking-wide">Assenti</span>
            <span id="statAssenti" class="text-xl font-black text-rose-700">0</span>
          </div>
          <div class="bg-amber-50 border border-amber-200/60 p-3 rounded-2xl shadow-inner">
            <span class="block text-xs font-bold text-amber-600 uppercase tracking-wide">Da Segnare</span>
            <span id="statDaSegnare" class="text-xl font-black text-amber-700">0</span>
          </div>
        </div>

        <!-- Azioni Rapide & Barra di Ricerca -->
        <div class="flex flex-col sm:flex-row items-center gap-3 pt-2">
          <div class="relative flex-1 w-full">
            <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="inputRicercaIscritto" oninput="filtraIscritti()" placeholder="Cerca iscritto per nome o cognome..." class="w-full bg-white/90 border border-slate-200 rounded-2xl pl-11 pr-4 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
          </div>
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <button onclick="segnaTutti('P')" class="flex-1 sm:flex-initial bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-3 rounded-2xl transition shadow-sm cursor-pointer">
              Segna tutti P
            </button>
            <button onclick="segnaTutti('')" class="flex-1 sm:flex-initial bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-4 py-3 rounded-2xl transition shadow-sm cursor-pointer">
              Azzera
            </button>
          </div>
        </div>

        <!-- Contenitore elenco iscritti dinamico -->
        <div id="contenutoSedeSpecifica" class="space-y-3 pt-2">
          <p class="text-slate-500 text-sm py-4 text-center">Caricamento iscritti...</p>
        </div>
      </div>
    </section>

    <!-- Wrapper Timbratura -->
    <section id="wrapperTimbratura" class="hidden space-y-4">
      <button onclick="tornaAllaHome()" class="text-emerald-600 text-sm font-semibold flex items-center gap-2 mb-2 hover:translate-x-[-4px] transition transform cursor-pointer">
        <i class="fa-solid fa-arrow-left"></i> Torna alla home
      </button>
      <div class="card-3d p-6 rounded-3xl border border-white/50">
        <h3 class="text-lg font-bold mb-4 text-emerald-600 flex items-center gap-2">
          <i class="fa-solid fa-clock"></i> Timbrature
        </h3>
        <p class="text-slate-500 text-sm">Sezione timbrature in caricamento...</p>
      </div>
    </section>

  </main>

 <!-- Blocco JavaScript Aggiornato: Rimossa tipologia, mantenuti solo ingressi residui -->
  <script>
    const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbxfB-OYCrKJMJI6cNamkOpNuDxCfjrAq4erhdL9FvcWXMmqPUjCtk8aGiGwbgS-el7r/exec";
    let sedeSelezionataCorrente = null;
    let listaAlunniGlobale = [];
    let colonnaGiornoGlobale = -1;
    let isDonMilaniIntegrazioneGlobale = false;

    function chiamaBackend(azione, payload = {}) {
      aggiornaStatoSalvataggio('salvataggio', 'Sincronizzazione...');
      
      const parametri = new URLSearchParams({
        azione: azione,
        ...payload
      });

      return fetch(`${URL_WEB_APP}?${parametri.toString()}`)
        .then(response => response.json())
        .then(data => {
          aggiornaStatoSalvataggio('pronto', 'Aggiornato');
          if (data.errore) throw new Error(data.errore);
          return data;
        })
        .catch(error => {
          aggiornaStatoSalvataggio('errore', 'Errore di connessione');
          console.error("Errore backend:", error);
          throw error;
        });
    }

    function aggiornaStatoSalvataggio(stato, messaggio) {
      var punto = document.getElementById('puntoStato');
      var testo = document.getElementById('testoStato');
      var coloreBg = "bg-emerald-400";
      
      if (stato === 'salvataggio') coloreBg = "bg-amber-400 animate-pulse";
      if (stato === 'errore') coloreBg = "bg-rose-400";

      if (punto) punto.className = `w-2.5 h-2.5 rounded-full inline-block shadow-sm ${coloreBg}`;
      if (testo) testo.innerText = messaggio;
    }

    function mostraSezione(idSezione) {
      var sezioni = ['schermataHome', 'wrapperRegistro', 'wrapperSedeSpecifica', 'wrapperTimbratura'];
      sezioni.forEach(id => {
        var el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      });

      var target = document.getElementById(idSezione);
      if (target) target.classList.remove('hidden');
    }

    function tornaAllaHome() {
      mostraSezione('schermataHome');
    }

    function apriRegistroPresenze() {
      mostraSezione('wrapperRegistro');
      caricaSediPresenze();
    }

    function formattaNomeSede(nomeTab) {
      let pulito = nomeTab.replace(/^PRESENZE_?/i, '').trim().toUpperCase();
      
      const dizionarioSedi = {
        'DON_BALBIANO': 'Don Balbiano',
        'DONBALBIANO': 'Don Balbiano',
        'DON_MILANI': 'Don Milani',
        'DONMILANI': 'Don Milani',
        'IQBAL_MASIH': 'Iqbal Masih',
        'IQBALMASIH': 'Iqbal Masih',
        'ISQBALMASIH': 'Iqbal Masih',
        'INTEGRAZIONE_ORARIO_SCOLASTICO': 'Integrazione Orario Scolastico',
        'INTEGRAZIONEORARIOSCOLASTICO': 'Integrazione Orario Scolastico'
      };

      if (dizionarioSedi[pulito]) {
        return dizionarioSedi[pulito];
      }

      return pulito
        .replace(/DONBALBIANO/g, 'Don Balbiano')
        .replace(/DONMILANI/g, 'Don Milani')
        .replace(/IQBALMASIH/g, 'Iqbal Masih')
        .replace(/INTEGRAZIONEORARIOSCOLASTICO/g, 'Integrazione Orario Scolastico')
        .replace(/_/g, ' ')
        .toLowerCase()
        .split(' ')
        .filter(word => word.length > 0)
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ');
    }

    function caricaSediPresenze() {
      var griglia = document.getElementById('grigliaSediPresenze');
      griglia.innerHTML = `
        <div class="col-span-full text-center py-8 text-slate-400 text-sm">
          <i class="fa-solid fa-spinner animate-spin text-blue-600 text-lg mr-2"></i> Lettura servizi dal foglio in corso...
        </div>
      `;

      chiamaBackend('ottieniElencoSedi')
        .then(data => {
          var listaSedi = Array.isArray(data) ? data : (data.sedi || data.risultato || []);
          renderizzaSedi(listaSedi);
        })
        .catch(err => {
          griglia.innerHTML = `<div class="col-span-full text-center py-6 text-rose-400 text-sm">Errore di caricamento sedi. Controlla la connessione.</div>`;
        });
    }

    function renderizzaSedi(listaSedi) {
      var griglia = document.getElementById('grigliaSediPresenze');
      griglia.innerHTML = "";

      if (!listaSedi || listaSedi.length === 0) {
        griglia.innerHTML = `<div class="col-span-full text-center py-6 text-slate-400 text-sm">Nessun tab presenze trovato nel foglio.</div>`;
        return;
      }

      listaSedi.forEach(nomeTabOriginale => {
        var nomeFormattato = formattaNomeSede(nomeTabOriginale);
        var btn = document.createElement('button');
        btn.className = "card-3d p-5 rounded-2xl flex items-center justify-between text-left group cursor-pointer border border-white/50 hover:border-blue-300";
        btn.innerHTML = `
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center text-lg group-hover:bg-blue-600 group-hover:text-white transition shadow-inner">
              <i class="fa-solid fa-location-dot"></i>
            </div>
            <div>
              <span class="font-bold text-slate-800 group-hover:text-blue-600 transition block">${nomeFormattato}</span>
              <span class="text-xs text-slate-400">Apri registro presenze</span>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-blue-600 transition"></i>
        `;
        btn.onclick = function() {
          selezionaSede(nomeTabOriginale, nomeFormattato);
        };
        griglia.appendChild(btn);
      });
    }

    function selezionaSede(nomeTabOriginale, nomeFormattato) {
      sedeSelezionataCorrente = { originale: nomeTabOriginale, formattato: nomeFormattato };
      
      document.getElementById('titoloSedeSelezionata').innerHTML = `<i class="fa-solid fa-clipboard-list"></i> ${nomeFormattato}`;
      document.getElementById('inputRicercaIscritto').value = "";
      mostraSezione('wrapperSedeSpecifica');
      
      caricaIscrittiSede(nomeTabOriginale);
    }

    function ricaricaIscrittiCorrenti() {
      if (sedeSelezionataCorrente) {
        caricaIscrittiSede(sedeSelezionataCorrente.originale);
      }
    }

    function caricaIscrittiSede(nomeTab) {
      var container = document.getElementById('contenutoSedeSpecifica');
      container.innerHTML = `
        <div class="text-center py-8 text-slate-400 text-sm">
          <i class="fa-solid fa-spinner animate-spin text-blue-600 text-lg mr-2"></i> Caricamento iscritti in corso...
        </div>
      `;

      chiamaBackend('ottieniDatiRegistro', { tab: nomeTab })
        .then(data => {
          listaAlunniGlobale = data.alunni || [];
          colonnaGiornoGlobale = data.colonnaGiorno || -1;
          isDonMilaniIntegrazioneGlobale = !!data.isDonMilaniIntegrazione;
          
          if (data.dataOdierna) {
            document.getElementById('dataOdiernaBadge').innerText = `Data odierna: ${data.dataOdierna}`;
          }

          listaAlunniGlobale.sort((a, b) => {
            let cognomeA = estraiCognome(a.nome);
            let cognomeB = estraiCognome(b.nome);
            return cognomeA.localeCompare(cognomeB);
          });

          renderizzaListaHTML(listaAlunniGlobale);
        })
        .catch(err => {
          container.innerHTML = `<p class="text-rose-400 text-sm py-4 text-center">Impossibile caricare gli iscritti per questo servizio.</p>`;
        });
    }

    function estraiCognome(nomeCompleto) {
      if (!nomeCompleto) return "";
      let parti = nomeCompleto.trim().split(" ");
      return parti[parti.length - 1].toLowerCase();
    }

    function filtraIscritti() {
      var query = document.getElementById('inputRicercaIscritto').value.toLowerCase().trim();
      var filtrati = listaAlunniGlobale.filter(alunno => {
        return alunno.nome && alunno.nome.toLowerCase().includes(query);
      });
      renderizzaListaHTML(filtrati);
    }

    function renderizzaListaHTML(lista) {
      var container = document.getElementById('contenutoSedeSpecifica');
      container.innerHTML = "";

      aggiornaRiepilogoStatistiche();

      if (!lista || lista.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-sm py-6 text-center">Nessun iscritto trovato.</p>`;
        return;
      }

      var tabOriginaleUpper = (sedeSelezionataCorrente && sedeSelezionataCorrente.originale) ? sedeSelezionataCorrente.originale.toUpperCase() : "";
      var isIqbalMasih = tabOriginaleUpper.includes("IQBAL");

      if (isDonMilaniIntegrazioneGlobale) {
        var gruppiClassi = {};
        lista.forEach(alunno => {
          var classe = (alunno.ingressi && String(alunno.ingressi).trim() !== "") ? String(alunno.ingressi).trim() : "Altre Classi";
          if (!gruppiClassi[classe]) gruppiClassi[classe] = [];
          gruppiClassi[classe].push(alunno);
        });

        var classiOrdinate = Object.keys(gruppiClassi).sort();

        classiOrdinate.forEach((classe, idx) => {
          var alunniClasse = gruppiClassi[classe];
          var idAccordion = `accordion-classe-${idx}`;

          var wrapperGruppo = document.createElement('div');
          wrapperGruppo.className = "bg-white/60 border border-slate-200 rounded-2xl p-4 space-y-3 shadow-sm";

          var headerGruppo = document.createElement('button');
          headerGruppo.className = "w-full flex justify-between items-center text-left font-bold text-slate-800 py-1 px-2 cursor-pointer focus:outline-none";
          headerGruppo.innerHTML = `
            <span class="flex items-center gap-2 text-blue-700 text-base">
              <i class="fa-solid fa-users-rectangle"></i> Classe: ${classe} <span class="text-xs bg-blue-100 text-blue-700 px-2.5 py-0.5 rounded-full ml-2">${alunniClasse.length} iscritti</span>
            </span>
            <i class="fa-solid fa-chevron-down text-slate-400 transition transform" id="icon-${idAccordion}"></i>
          `;

          var contenitoreAlunniGruppo = document.createElement('div');
          contenitoreAlunniGruppo.id = idAccordion;
          contenitoreAlunniGruppo.className = "space-y-3 pt-2 hidden";

          headerGruppo.onclick = function() {
            var el = document.getElementById(idAccordion);
            var ico = document.getElementById(`icon-${idAccordion}`);
            if (el.classList.contains('hidden')) {
              el.classList.remove('hidden');
              ico.classList.add('rotate-180');
            } else {
              el.classList.add('hidden');
              ico.classList.remove('rotate-180');
            }
          };

          alunniClasse.forEach(alunno => {
            contenitoreAlunniGruppo.appendChild(creaElementoAlunnoHTML(alunno, isIqbalMasih, true));
          });

          wrapperGruppo.appendChild(headerGruppo);
          wrapperGruppo.appendChild(contenitoreAlunniGruppo);
          container.appendChild(wrapperGruppo);
        });

      } else {
        var ul = document.createElement('div');
        ul.className = "space-y-3";
        lista.forEach(alunno => {
          ul.appendChild(creaElementoAlunnoHTML(alunno, isIqbalMasih, false));
        });
        container.appendChild(ul);
      }
    }

    function creaElementoAlunnoHTML(alunno, isIqbalMasih, isDonMilani) {
      var statoNorm = (alunno.stato || "").trim().toUpperCase();
      var isPresente = (statoNorm === "P" || statoNorm === "PRESENTE");
      var isAssente = (statoNorm === "A" || statoNorm === "ASSENTE");

      var tipoLower = (alunno.tipo || "").toLowerCase();
      // Mostra gli ingressi residui SOLO se la tipologia contiene riferimenti agli ingressi/pacchetti/carnet (escludendo i fissi puri)
      var mostraIngressiResidui = !isDonMilani && (tipoLower.includes("ingresso") || tipoLower.includes("pacchetto") || tipoLower.includes("carnet") || tipoLower.includes("pacchetto ingressi"));

      var servizioExtraChecked = false;
      if (alunno.servizioExtra) {
        var valSe = String(alunno.servizioExtra).trim().toUpperCase();
        servizioExtraChecked = (valSe === "SÌ" || valSe === "SI" || valSe === "TRUE" || valSe === "X" || valSe === "1" || valSe === "VERO");
      }

      var item = document.createElement('div');
      item.className = "bg-white/90 p-4 rounded-2xl border border-slate-200/60 shadow-sm flex flex-col gap-3 transition";
      item.id = `iscritto-row-${alunno.riga}`;

      item.innerHTML = `
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-base shadow-inner shrink-0">
              <i class="fa-solid fa-child"></i>
            </div>
            <div>
              <span class="font-bold text-slate-800 text-base block">${alunno.nome}</span>
              ${mostraIngressiResidui ? `
                <span class="text-xs text-slate-400 block mt-0.5">
                  Ingressi residui: <span id="ingressi-val-${alunno.riga}" class="font-bold text-blue-600">${alunno.ingressi}</span>
                </span>
              ` : ''}
            </div>
          </div>

          <!-- Controlli Iqbal Masih -->
          ${isIqbalMasih ? `
            <div class="flex items-center gap-3 bg-blue-50/50 px-3 py-1.5 rounded-xl border border-blue-100 self-start md:self-center">
              <label class="flex items-center gap-1.5 cursor-pointer text-xs font-semibold text-slate-700">
                <input type="checkbox" id="servizio-extra-${alunno.riga}" ${servizioExtraChecked ? 'checked' : ''} 
                  onchange="aggiornaServizioExtra(${alunno.riga})" 
                  class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer">
                Servizio Extra
              </label>
              <div class="h-4 w-px bg-blue-200"></div>
              <div class="flex items-center gap-1.5">
                <label for="ore-extra-${alunno.riga}" class="text-xs font-semibold text-slate-700">Ore Extra:</label>
                <input type="number" id="ore-extra-${alunno.riga}" value="${alunno.oreExtra !== undefined && alunno.oreExtra !== "" ? alunno.oreExtra : 0}" min="0" step="1" 
                  onchange="aggiornaOreExtra(${alunno.riga})" 
                  class="w-16 px-2 py-1 text-xs font-bold text-center bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
              </div>
            </div>
          ` : ''}

          <div class="flex items-center gap-2 self-end md:self-center">
            <button onclick="impostaStatoPresenza(${alunno.riga}, 'P')" 
              class="btn-presente-${alunno.riga} px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm cursor-pointer ${isPresente ? 'bg-emerald-600 text-white shadow-emerald-200 scale-105' : 'bg-slate-100 text-slate-600 hover:bg-emerald-100 hover:text-emerald-700'}">
              <i class="fa-solid fa-check mr-1"></i> Presente
            </button>
            <button onclick="impostaStatoPresenza(${alunno.riga}, 'A')" 
              class="btn-assente-${alunno.riga} px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm cursor-pointer ${isAssente ? 'bg-rose-600 text-white shadow-rose-200 scale-105' : 'bg-slate-100 text-slate-600 hover:bg-rose-100 hover:text-rose-700'}">
              <i class="fa-solid fa-xmark mr-1"></i> Assente
            </button>
            <button onclick="toggleInfo(${alunno.riga})" 
              class="bg-slate-100 hover:bg-blue-100 text-slate-600 hover:text-blue-600 p-2.5 rounded-xl text-xs font-bold transition shadow-sm cursor-pointer" title="Informazioni utente">
              <i class="fa-solid fa-circle-info"></i>
            </button>
          </div>
        </div>

        <!-- Box Info Anagrafico Espandibile -->
        <div id="info-box-${alunno.riga}" class="hidden mt-2 pt-3 border-t border-slate-100 text-xs text-slate-600 grid grid-cols-1 sm:grid-cols-2 gap-2 bg-slate-50 p-3 rounded-xl">
          <div><strong class="text-slate-700">Email:</strong> ${alunno.email || '-'}</div>
          <div><strong class="text-slate-700">Cellulare:</strong> ${alunno.cellulare || '-'}</div>
          <div><strong class="text-slate-700">Deleghe:</strong> ${alunno.deleghe || '-'}</div>
          <div><strong class="text-slate-700">Uscita Autonoma:</strong> ${alunno.uscitaAutonoma || '-'}</div>
        </div>
      `;
      return item;
    }

    function toggleInfo(riga) {
      var box = document.getElementById(`info-box-${riga}`);
      if (box) {
        box.classList.toggle('hidden');
      }
    }

    function aggiornaServizioExtra(riga) {
      var alunno = listaAlunniGlobale.find(a => a.riga === riga);
      if (!alunno) return;

      var checkbox = document.getElementById(`servizio-extra-${riga}`);
      var nuovoValore = checkbox.checked ? "Sì" : "";
      alunno.servizioExtra = nuovoValore;

      chiamaBackend('salvaCampoExtra', {
        tab: sedeSelezionataCorrente.originale,
        riga: riga,
        colonna: 38,
        valore: nuovoValore
      }).catch(err => console.error("Errore salvataggio Servizio Extra:", err));
    }

    function aggiornaOreExtra(riga) {
      var alunno = listaAlunniGlobale.find(a => a.riga === riga);
      if (!alunno) return;

      var inputNum = document.getElementById(`ore-extra-${riga}`);
      var nuovoValore = inputNum.value;
      alunno.oreExtra = nuovoValore;

      chiamaBackend('salvaCampoExtra', {
        tab: sedeSelezionataCorrente.originale,
        riga: riga,
        colonna: 39,
        valore: nuovoValore
      }).catch(err => console.error("Errore salvataggio Ore Extra:", err));
    }

    function impostaStatoPresenza(riga, nuovoStato) {
      var alunno = listaAlunniGlobale.find(a => a.riga === riga);
      if (!alunno) return;

      var eraPresente = (alunno.stato === "P" || alunno.stato === "PRESENTE");

      if (alunno.stato === nuovoStato) {
        alunno.stato = "";
      } else {
        alunno.stato = nuovoStato;
      }

      var oraPresente = (alunno.stato === "P" || alunno.stato === "PRESENTE");

      var tipoLower = (alunno.tipo || "").toLowerCase();
      var gestisceIngressi = !isDonMilaniIntegrazioneGlobale && (tipoLower.includes("ingresso") || tipoLower.includes("pacchetto") || tipoLower.includes("carnet"));

      if (gestisceIngressi && !eraPresente && oraPresente) {
        alunno.ingressi = Math.max(0, Number(alunno.ingressi || 0) - 1);
      } else if (gestisceIngressi && eraPresente && !oraPresente) {
        alunno.ingressi = Number(alunno.ingressi || 0) + 1;
      }

      aggiornaUIElementoSingolo(riga, alunno.stato, alunno.ingressi);
      aggiornaRiepilogoStatistiche();

      chiamaBackend('salvaPresenza', {
        tab: sedeSelezionataCorrente.originale,
        riga: riga,
        colonna: colonnaGiornoGlobale,
        stato: alunno.stato
      }).then(res => {
        if (res && res.nuoviIngressi !== undefined && res.nuoviIngressi !== "-") {
          alunno.ingressi = res.nuoviIngressi;
          var spanIngressi = document.getElementById(`ingressi-val-${riga}`);
          if (spanIngressi) spanIngressi.innerText = res.nuoviIngressi;
        }
      }).catch(err => {
        console.error("Errore salvataggio presenza:", err);
      });
    }

    function aggiornaUIElementoSingolo(riga, stato, ingressiAggiornati) {
      var btnP = document.querySelector(`.btn-presente-${riga}`);
      var btnA = document.querySelector(`.btn-assente-${riga}`);
      var spanIngressi = document.getElementById(`ingressi-val-${riga}`);
      
      if (!btnP || !btnA) return;

      var isPresente = (stato === "P" || stato === "PRESENTE");
      var isAssente = (stato === "A" || stato === "ASSENTE");

      btnP.className = `btn-presente-${riga} px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm cursor-pointer ${isPresente ? 'bg-emerald-600 text-white shadow-emerald-200 scale-105' : 'bg-slate-100 text-slate-600 hover:bg-emerald-100 hover:text-emerald-700'}`;
      btnA.className = `btn-assente-${riga} px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm cursor-pointer ${isAssente ? 'bg-rose-600 text-white shadow-rose-200 scale-105' : 'bg-slate-100 text-slate-600 hover:bg-rose-100 hover:text-rose-700'}`;
      
      if (spanIngressi && ingressiAggiornati !== undefined && !isDonMilaniIntegrazioneGlobale) {
        spanIngressi.innerText = ingressiAggiornati;
      }
    }

    function aggiornaRiepilogoStatistiche() {
      var presenti = 0;
      var assenti = 0;
      var daSegnare = 0;

      listaAlunniGlobale.forEach(a => {
        var st = (a.stato || "").trim().toUpperCase();
        if (st === "P" || st === "PRESENTE") presenti++;
        else if (st === "A" || st === "ASSENTE") assenti++;
        else daSegnare++;
      });

      document.getElementById('statPresenti').innerText = presenti;
      document.getElementById('statAssenti').innerText = assenti;
      document.getElementById('statDaSegnare').innerText = daSegnare;
    }

    function segnaTutti(statoForzato) {
      if (!listaAlunniGlobale || listaAlunniGlobale.length === 0) return;

      listaAlunniGlobale.forEach(a => {
        a.stato = statoForzato;
        aggiornaUIElementoSingolo(a.riga, statoForzato, a.ingressi);
        
        chiamaBackend('salvaPresenza', {
          tab: sedeSelezionataCorrente.originale,
          riga: a.riga,
          colonna: colonnaGiornoGlobale,
          stato: statoForzato
        }).catch(err => console.error("Errore salvataggio di massa:", err));
      });

      aggiornaRiepilogoStatistiche();
    }

    document.addEventListener("DOMContentLoaded", function() {
      console.log("Interfaccia aggiornata: tipologie nascoste, visibili solo gli ingressi residui ove previsto.");
    });
  </script>
</body>
</html>
