<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Associazione Evolversi</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: radial-gradient(circle at top center, #f8fafc 0%, #e2e8f0 100%);
    }
    .card-3d {
      background: linear-gradient(145deg, #ffffff, #f1f5f9);
      box-shadow: 10px 10px 20px #cbd5e1, -10px -10px 20px #ffffff, inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-3d:hover {
      transform: translateY(-4px);
      box-shadow: 15px 15px 30px #cbd5e1, -15px -15px 30px #ffffff, inset 0 1px 0 rgba(255, 255, 255, 1);
    }
    .card-3d:active {
      transform: translateY(-1px);
      box-shadow: 5px 5px 10px #cbd5e1, -5px -5px 10px #ffffff;
    }
    .header-3d {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.3);
    }
    .btn-icon-3d {
      background: linear-gradient(145deg, #eff6ff, #dbeafe);
      box-shadow: 5px 5px 10px #bfdbfe, -5px -5px 10px #ffffff;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Header Blu Moderno e Tridimensionale -->
  <header class="header-3d text-white p-5 flex justify-between items-center sticky top-0 z-50 backdrop-blur-md border-b border-blue-500/20">
    <div class="flex items-center gap-3">
      <img src="https://lh3.googleusercontent.com/d/1U3wZDb34MJyIGitW-ZEmgd5cRBDorTG3=s220" alt="Logo Evolversi" class="w-10 h-10 object-contain rounded-full bg-white/10 p-1 shadow-inner">
      <span class="font-black text-lg tracking-wider drop-shadow-sm">ASSOCIAZIONE EVOLVERSI</span>
    </div>
    <div class="flex items-center gap-4 text-xl">
      <a href="#" target="_blank" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition shadow-inner" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
      <a href="#" target="_blank" class="w-9 h-9 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition shadow-inner" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
    </div>
  </header>

  <!-- Indicatore di stato -->
  <div class="max-w-4xl w-full mx-auto px-4 pt-3 flex justify-end items-center text-xs text-slate-500">
    <div id="statoConnessione" class="flex items-center gap-2 bg-white/80 backdrop-blur px-3 py-1 rounded-full shadow-sm border border-slate-200/60">
      <span id="puntoStato" class="w-2.5 h-2.5 rounded-full inline-block bg-emerald-400 shadow-sm"></span>
      <span id="testoStato" class="font-medium">Pronto</span>
    </div>
  </div>

  <!-- Contenitore Principale -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-center">

    <!-- Schermata Home -->
    <section id="schermataHome" class="space-y-6 py-6">
      <div class="text-center mb-10">
        <h2 class="text-3xl font-black text-slate-900 tracking-tight drop-shadow-sm">Gestione Attività</h2>
        <p class="text-slate-500 text-sm mt-1">Seleziona una sezione per accedere ai servizi</p>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-2xl mx-auto w-full">
        <button onclick="apriRegistroPresenze()" class="card-3d p-8 rounded-3xl flex flex-col items-center justify-center gap-5 text-center group cursor-pointer border border-white/50">
          <div class="w-20 h-20 btn-icon-3d text-blue-600 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition duration-300">
            <i class="fa-solid fa-clipboard-user"></i>
          </div>
          <div>
            <span class="text-xl font-bold text-slate-800 block group-hover:text-blue-600 transition">Registro Presenze</span>
            <span class="text-xs text-slate-400 font-medium">Seleziona sede o servizio</span>
          </div>
        </button>

        <button onclick="mostraSezione('wrapperTimbratura')" class="card-3d p-8 rounded-3xl flex flex-col items-center justify-center gap-5 text-center group cursor-pointer border border-white/50">
          <div class="w-20 h-20 btn-icon-3d text-emerald-600 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition duration-300">
            <i class="fa-solid fa-clock"></i>
          </div>
          <div>
            <span class="text-xl font-bold text-slate-800 block group-hover:text-emerald-600 transition">Timbrature</span>
            <span class="text-xs text-slate-400 font-medium">Registrazione ingressi e uscite</span>
          </div>
        </button>
      </div>
    </section>

    <!-- Wrapper Registro Presenze (Sedi e Servizi) -->
    <section id="wrapperRegistro" class="hidden space-y-4">
      <button onclick="tornaAllaHome()" class="text-blue-600 text-sm font-semibold flex items-center gap-2 mb-2 hover:translate-x-[-4px] transition transform cursor-pointer">
        <i class="fa-solid fa-arrow-left"></i> Torna alla home
      </button>
      <div class="card-3d p-6 sm:p-8 rounded-3xl border border-white/50">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-xl font-black text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-building text-blue-600"></i> Seleziona Sede o Servizio
          </h3>
          <button onclick="caricaSediPresenze()" class="text-xs text-blue-600 hover:underline font-medium flex items-center gap-1">
            <i class="fa-solid fa-rotate"></i> Aggiorna
          </button>
        </div>
        <!-- Griglia dinamica delle sedi/servizi dal tab PRESENZE -->
        <div id="grigliaSediPresenze" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="col-span-full text-center py-8 text-slate-400 text-sm">
            <i class="fa-solid fa-spinner animate-spin text-blue-600 text-lg mr-2"></i> Caricamento sedi in corso...
          </div>
        </div>
      </div>
    </section>

    <!-- Wrapper Sede Specifica (dove si aprirà il registro effettivo della sede scelta) -->
    <section id="wrapperSedeSpecifica" class="hidden space-y-4">
      <button onclick="apriRegistroPresenze()" class="text-blue-600 text-sm font-semibold flex items-center gap-2 mb-2 hover:translate-x-[-4px] transition transform cursor-pointer">
        <i class="fa-solid fa-arrow-left"></i> Torna alla scelta sedi
      </button>
      <div class="card-3d p-6 sm:p-8 rounded-3xl border border-white/50">
        <h3 id="titoloSedeSelezionata" class="text-xl font-black text-blue-600 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-clipboard-list"></i> Registro Sede
        </h3>
        <div id="contenutoSedeSpecifica">
          <p class="text-slate-500 text-sm">Caricamento registro...</p>
        </div>
      </div>
    </section>

    <!-- Wrapper Timbratura -->
    <section id="wrapperTimbratura" class="hidden space-y-4">
      <button onclick="tornaAllaHome()" class="text-emerald-600 text-sm font-semibold flex items-center gap-2 mb-2 hover:translate-x-[-4px] transition transform cursor-pointer">
        <i class="fa-solid fa-arrow-left"></i> Torna alla home
      </button>
      <div class="card-3d p-6 rounded-3xl border border-white/50">
        <h3 class="text-lg font-bold mb-4 text-emerald-600 flex items-center gap-2">
          <i class="fa-solid fa-clock"></i> Timbrature
        </h3>
        <p class="text-slate-500 text-sm">Sezione timbrature in caricamento...</p>
      </div>
    </section>

  </main>

  <!-- Blocco JavaScript -->
  <script>
    const URL_WEB_APP = "INCOLLA_QUI_IL_TUO_URL_APPS_SCRIPT";

    function chiamaBackend(azione, payload = {}) {
      aggiornaStatoSalvataggio('salvataggio', 'Sincronizzazione...');
      
      const datiInvio = {
        azione: azione,
        ...payload
      };

      return fetch(URL_WEB_APP, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify(datiInvio)
      })
      .then(response => {
        aggiornaStatoSalvataggio('pronto', 'Aggiornato');
        return response.json().catch(() => ({ success: true }));
      })
      .catch(error => {
        aggiornaStatoSalvataggio('errore', 'Errore di connessione');
        console.error("Errore backend:", error);
        throw error;
      });
    }

    function aggiornaStatoSalvataggio(stato, messaggio) {
      var punto = document.getElementById('puntoStato');
      var testo = document.getElementById('testoStato');
      var coloreBg = "bg-emerald-400";
      
      if (stato === 'salvataggio') coloreBg = "bg-amber-400 animate-pulse";
      if (stato === 'errore') coloreBg = "bg-rose-400";

      if (punto) punto.className = `w-2.5 h-2.5 rounded-full inline-block shadow-sm ${coloreBg}`;
      if (testo) testo.innerText = messaggio;
    }

    function mostraSezione(idSezione) {
      var sezioni = ['schermataHome', 'wrapperRegistro', 'wrapperSedeSpecifica', 'wrapperTimbratura'];
      sezioni.forEach(id => {
        var el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      });

      var target = document.getElementById(idSezione);
      if (target) target.classList.remove('hidden');
    }

    function tornaAllaHome() {
      mostraSezione('schermataHome');
    }

    function apriRegistroPresenze() {
      mostraSezione('wrapperRegistro');
      caricaSediPresenze();
    }

    // Funzione per caricare le sedi/servizi dal tab PRESENZE del foglio Google
    function caricaSediPresenze() {
      var griglia = document.getElementById('grigliaSediPresenze');
      griglia.innerHTML = `
        <div class="col-span-full text-center py-8 text-slate-400 text-sm">
          <i class="fa-solid fa-spinner animate-spin text-blue-600 text-lg mr-2"></i> Caricamento sedi in corso...
        </div>
      `;

      // Chiamata al backend per recuperare la lista delle sedi dal tab PRESENZE
      // Assicurati che il tuo Google Apps Script gestisca l'azione 'getSediPresenze' restituendo un array di nomi
      fetch(URL_WEB_APP + "?azione=getSediPresenze")
        .then(response => response.json())
        .then(data => {
          // Se la tua Web App usa POST o restituisce direttamente i dati:
          renderizzaSedi(data.sedi || data);
        })
        .catch(err => {
          console.warn("Simulazione o errore fetch GET, provo chiamata POST o fallback dati locali:", err);
          
          // Esempio di fallback o chiamata POST se il tuo script Apps Script risponde via POST:
          chiamaBackend('getSediPresenze')
            .then(res => {
              // Se hai già un array di sedi nel vecchio codice, inseriscilo qui sotto come test se necessario
              renderizzaSedi(res.sedi || ["Sede Centrale", "Servizio Volvera", "Doposcuola Campana", "Le Gerbole"]);
            })
            .catch(() => {
              // Fallbox di emergenza con dati dimostrativi se il backend non è ancora collegato
              renderizzaSedi(["Sede Centrale - Evolversi", "Servizio Volvera", "Doposcuola Campana", "Le Gerbole"]);
            });
        });
    }

    function renderizzaSedi(listaSedi) {
      var griglia = document.getElementById('grigliaSediPresenze');
      griglia.innerHTML = "";

      if (!listaSedi || listaSedi.length === 0) {
        griglia.innerHTML = `<div class="col-span-full text-center py-6 text-slate-400 text-sm">Nessuna sede trovata nel tab PRESENZE.</div>`;
        return;
      }

      listaSedi.forEach(sede => {
        var btn = document.createElement('button');
        btn.className = "card-3d p-5 rounded-2xl flex items-center justify-between text-left group cursor-pointer border border-white/50 hover:border-blue-300";
        btn.innerHTML = `
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center text-lg group-hover:bg-blue-600 group-hover:text-white transition shadow-inner">
              <i class="fa-solid fa-location-dot"></i>
            </div>
            <div>
              <span class="font-bold text-slate-800 group-hover:text-blue-600 transition block">${sede}</span>
              <span class="text-xs text-slate-400">Apri registro presenze</span>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-blue-600 transition"></i>
        `;
        btn.onclick = function() {
          selezionaSede(sede);
        };
        griglia.appendChild(btn);
      });
    }

    function selezionaSede(nomeSede) {
      document.getElementById('titoloSedeSelezionata').innerHTML = `<i class="fa-solid fa-clipboard-list"></i> Registro: ${nomeSede}`;
      mostraSezione('wrapperSedeSpecifica');
      
      var container = document.getElementById('contenutoSedeSpecifica');
      container.innerHTML = `<p class="text-slate-500 text-sm py-4">Caricamento presenze per ${nomeSede}...</p>`;
      
      // Qui integrerai la logica specifica per caricare i dati dei partecipanti/presenze della sede scelta
    }

    document.addEventListener("DOMContentLoaded", function() {
      console.log("Interfaccia Evolversi 3D avviata");
    });
  </script>
</body>
</html>
