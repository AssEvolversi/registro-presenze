<script>
  let colonnaGiornoCorrente = -1;
  let tabSelezionatoCorrente = "";
  let elencoAlunniGlobale = [];
  let filtroStatoAttivo = 'tutti';

  // All'avvio non carichiamo automaticamente nulla, lasciamo che l'utente veda la Home con le 2 icone
  window.onload = function() {
    console.log("Pagina caricata correttamente. In attesa di selezione utente.");
  };

 function apriSezione(tipo) {
  var home = document.getElementById('schermataHome');
  var reg = document.getElementById('wrapperRegistro');
  var timb = document.getElementById('wrapperTimbratura');

  // Nascondi tutto
  if (home) home.classList.add('hidden');
  if (reg) reg.classList.add('hidden');
  if (timb) timb.classList.add('hidden');

  if (tipo === 'registro') {
    if (reg) reg.classList.remove('hidden');
    if (typeof caricaSedi === 'function') caricaSedi();
  } else if (tipo === 'timbratura') {
    if (timb) timb.classList.remove('hidden');
    // Avvia il caricamento dati della timbratura
    if (typeof caricaDatiIniziali === 'function') {
      caricaDatiIniziali();
    } else if (typeof caricaDatiInizialiTimbratura === 'function') {
      caricaDatiInizialiTimbratura();
    }
  }
}
function tornaAllaHome() {
  var home = document.getElementById('schermataHome');
  var reg = document.getElementById('wrapperRegistro');
  var timb = document.getElementById('wrapperTimbratura');

  if (home) home.classList.remove('hidden');
  if (reg) reg.classList.add('hidden');
  if (timb) timb.classList.add('hidden'); // CORRETTO: era 'reg'
  
  if (typeof tornaAllaSelezioneSedi === 'function') {
    tornaAllaSelezioneSedi();
  }
}

function popolaMenuOperatori(operatori) {
  // Sostituisci 'selectOperatore' con l'ID reale del tuo menu a tendina degli operatori nel file HTML
  var select = document.getElementById('selectOperatore'); 
  if (!select) return;
  
  select.innerHTML = '<option value="">Seleziona operatore...</option>';
  operatori.forEach(function(op) {
    var opt = document.createElement('option');
    opt.value = op.nome;
    opt.textContent = op.nome + (op.mansioni ? ' (' + op.mansioni + ')' : '');
    select.appendChild(opt);
  });
}

function popolaMenuServizi(servizi) {
  // Sostituisci 'selectServizio' con l'ID reale del tuo menu a tendina dei servizi/plessi nel file HTML
  var select = document.getElementById('selectServizio');
  if (!select) return;
  
  select.innerHTML = '<option value="">Seleziona plesso / servizio...</option>';
  servizi.forEach(function(serv) {
    var opt = document.createElement('option');
    opt.value = serv.etichetta;
    opt.textContent = serv.etichetta;
    select.appendChild(opt);
  });
}

  function aggiornaStatoSalvataggio(stato, messaggio) {
    var punto = document.getElementById('puntoStato');
    var testo = document.getElementById('testoStato');
    var puntoM = document.getElementById('puntoStatoMobile');
    var testoM = document.getElementById('testoStatoMobile');
    
    var coloreBg = "bg-green-400";
    if (stato === 'salvataggio') coloreBg = "bg-yellow-400 animate-pulse";
    if (stato === 'errore') coloreBg = "bg-red-400";

    if (punto) punto.className = `w-2.5 h-2.5 rounded-full inline-block shadow-sm ${coloreBg}`;
    if (testo) testo.innerText = messaggio;
    if (puntoM) puntoM.className = `w-2 h-2 rounded-full inline-block ${coloreBg}`;
    if (testoM) testoM.innerText = messaggio;
  }

  function caricaSedi() {
    var griglia = document.getElementById('grigliaSedi');
    if (!griglia) return;

    griglia.innerHTML = '<div class="p-4 rounded-2xl border-2 border-dashed border-blue-200 bg-white text-center text-blue-500 text-sm col-span-full animate-pulse">Caricamento sedi in corso...</div>';

    google.script.run
      .withSuccessHandler(function(listaSedi) {
        console.log("Lista sedi ricevuta dal server:", listaSedi);
        griglia.innerHTML = '';

        if (!listaSedi || listaSedi.length === 0) {
          griglia.innerHTML = '<div class="p-4 rounded-2xl bg-white text-center text-gray-500 text-sm col-span-full">Nessuna sede trovata (verifica nome fogli)</div>';
          return;
        }

        listaSedi.forEach(function(nomeTab) {
          var nomeFormattato = formattaNomeTab(nomeTab);
          var icona = "fa-child";
          var coloreBordo = "border-blue-100 hover:border-blue-500 hover:bg-blue-50";
          var nomeLower = nomeTab.toLowerCase();

          if (nomeLower.includes('prescuola')) {
            icona = "fa-sun";
            coloreBordo = "border-amber-100 hover:border-amber-500 hover:bg-amber-50";
          } else if (nomeLower.includes('postscuola') || nomeLower.includes('doposcuola')) {
            icona = "fa-book-reader";
            coloreBordo = "border-indigo-100 hover:border-indigo-500 hover:bg-indigo-50";
          } else if (nomeLower.includes('integrazione')) {
            icona = "fa-users";
            coloreBordo = "border-emerald-100 hover:border-emerald-500 hover:bg-emerald-50";
          }

          var cardDiv = document.createElement('div');
          cardDiv.className = `p-3.5 rounded-2xl border-2 ${coloreBordo} bg-white shadow-sm cursor-pointer transition-all duration-200 flex items-center justify-between group active:scale-95`;
          cardDiv.onclick = function() {
            selezionaServizioDaGriglia(nomeTab, nomeFormattato);
          };

          cardDiv.innerHTML = `
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center font-bold group-hover:scale-110 transition">
                <i class="fas ${icona}"></i>
              </div>
              <div>
                <div class="font-bold text-gray-800 text-sm sm:text-base">${nomeFormattato}</div>
                <div class="text-[11px] text-gray-400">Clicca per aprire il registro</div>
              </div>
            </div>
            <div class="text-blue-400 group-hover:translate-x-1 transition">
              <i class="fas fa-chevron-right"></i>
            </div>
          `;
          griglia.appendChild(cardDiv);
        });
      })
      .withFailureHandler(function(err) {
        console.error("Fallimento chiamata sedi:", err);
        griglia.innerHTML = '<div class="p-4 rounded-2xl bg-red-50 text-center text-red-500 text-sm col-span-full">Errore caricamento: ' + err.message + '</div>';
      })
      .ottieniElencoSedi();
  }

  function formattaNomeTab(nomeTab) {
    var pulito = nomeTab.replace("PRESENZE_", "");
    pulito = pulito.replace(/[-_]/g, " ");
    pulito = pulito.replace(/donmilani/gi, "Don Milani");
    pulito = pulito.replace(/donbalbiano/gi, "Don Balbiano");
    pulito = pulito.replace(/iqbalmasih/gi, "Iqbal Masih");
    pulito = pulito.replace(/prescuola/gi, "Pre Scuola");
    pulito = pulito.replace(/postscuola/gi, "Post Scuola");
    pulito = pulito.replace(/doposcuola/gi, "Dopo Scuola");
    pulito = pulito.replace(/integrazioneorarioscolastico/gi, "Integrazione Orario Scolastico");

    var parole = pulito.split(/\s+/);
    var paroleFormattate = parole.map(function(parola) {
      if (!parola) return "";
      return parola.charAt(0).toUpperCase() + parola.slice(1).toLowerCase();
    });
    return paroleFormattate.join(" ");
  }

  function selezionaServizioDaGriglia(nomeTab, nomeFormattato) {
    tabSelezionatoCorrente = nomeTab;
    document.getElementById('grigliaSedi').classList.add('hidden');
    document.getElementById('pannelloAzioni').classList.remove('hidden');
    document.getElementById('titoloServizioSelezionato').innerText = "Servizio attivo: " + nomeFormattato;
    document.getElementById('footerRiepilogo').classList.remove('hidden');
    document.getElementById('inputRicerca').value = "";
    filtroStatoAttivo = 'tutti';
    aggiornaStiliFiltriRapidi();

    var area = document.getElementById('areaContenuto');
    area.innerHTML = `
      <div class="max-w-4xl mx-auto space-y-4 animate-pulse-slow mt-4">
        <div class="h-6 bg-gray-200 rounded-xl w-48 ml-auto mb-4"></div>
        <div class="h-24 bg-gray-200 rounded-2xl w-full"></div>
        <div class="h-24 bg-gray-200 rounded-2xl w-full"></div>
        <div class="h-24 bg-gray-200 rounded-2xl w-full"></div>
      </div>
    `;

    google.script.run
      .withSuccessHandler(function(risposta) {
        if (risposta.errore) {
          area.innerHTML = '<div class="max-w-4xl mx-auto text-center text-red-500 mt-12 text-lg">' + risposta.errore + '</div>';
          return;
        }
        colonnaGiornoCorrente = risposta.colonnaGiorno;
        if (colonnaGiornoCorrente === -1) {
          area.innerHTML = '<div class="max-w-4xl mx-auto text-center text-orange-500 mt-12 font-semibold p-4 text-lg">Attenzione: Impossibile trovare la colonna per la data di oggi (' + risposta.dataOdierna + ') nel registro.</div>';
          return;
        }
        elencoAlunniGlobale = risposta.alunni || [];
        applicaFiltriComplessivi(risposta.dataOdierna, risposta.isDonMilaniIntegrazione);
        aggiornaStatoSalvataggio('ok', 'Sincronizzato');
      })
      .withFailureHandler(function(err) {
        area.innerHTML = '<div class="max-w-4xl mx-auto text-center text-red-500 mt-12 text-lg">Errore nel caricamento: ' + err.message + '</div>';
        aggiornaStatoSalvataggio('errore', 'Errore di rete');
      })
      .ottieniDatiRegistro(tabSelezionatoCorrente);
  }

  function tornaAllaSelezioneSedi() {
    document.getElementById('grigliaSedi').classList.remove('hidden');
    document.getElementById('pannelloAzioni').classList.add('hidden');
    document.getElementById('footerRiepilogo').classList.add('hidden');
    document.getElementById('areaContenuto').innerHTML = `
      <div class="max-w-4xl mx-auto text-center text-gray-400 mt-16 text-lg">
        Seleziona un servizio dalla griglia in alto per visualizzare l'elenco dei bambini.
      </div>
    `;
  }

  function impostaFiltroStato(stato) {
    filtroStatoAttivo = stato;
    aggiornaStiliFiltriRapidi();
    applicaFiltriComplessivi();
  }

  function aggiornaStiliFiltriRapidi() {
    var filtri = ['tutti', 'da-segnare', 'presenti', 'assenti'];
    filtri.forEach(f => {
      var btn = document.getElementById('filtro-' + f);
      if (!btn) return;
      if (f === filtroStatoAttivo) {
        btn.className = "px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-blue-600 text-white shadow-sm transition active:scale-95";
      } else {
        btn.className = "px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-gray-100 text-gray-700 hover:bg-gray-200 shadow-sm transition active:scale-95";
      }
    });
  }

  function applicaFiltriComplessivi(dataOdiernaParam, isDonMilaniParam) {
    var queryInput = document.getElementById('inputRicerca');
    var query = queryInput ? queryInput.value.toLowerCase().trim() : "";

    var filtrati = elencoAlunniGlobale.filter(function(alunno) {
      var corrispondeNome = alunno.nome.toLowerCase().includes(query);
      var isPresente = (alunno.stato === 'P' || alunno.stato === 'PRESENTE');
      var isAssente = (alunno.stato === 'A' || alunno.stato === 'ASSENTE');
      var isDaSegnare = !isPresente && !isAssente;

      var corrispondeStato = true;
      if (filtroStatoAttivo === 'da-segnare') corrispondeStato = isDaSegnare;
      if (filtroStatoAttivo === 'presenti') corrispondeStato = isPresente;
      if (filtroStatoAttivo === 'assenti') corrispondeStato = isAssente;

      return corrispondeNome && corrispondeStato;
    });

    var isDonMilani = isDonMilaniParam !== undefined ? isDonMilaniParam : (tabSelezionatoCorrente.toLowerCase().indexOf("donmilani") !== -1 && tabSelezionatoCorrente.toLowerCase().indexOf("integrazione") !== -1);
    renderizzaLista(filtrati, dataOdiernaParam, isDonMilani);
  }

  function ordinaAlunniPerCognome(alunni) {
    return alunni.slice().sort(function(a, b) {
      var partiA = a.nome.trim().split(/\s+/);
      var partiB = b.nome.trim().split(/\s+/);
      var cognomeA = partiA.length > 1 ? partiA[partiA.length - 1].toLowerCase() : partiA[0].toLowerCase();
      var cognomeB = partiB.length > 1 ? partiB[partiB.length - 1].toLowerCase() : partiB[0].toLowerCase();

      if (cognomeA < cognomeB) return -1;
      if (cognomeA > cognomeB) return 1;
      return 0;
    });
  }

  function renderizzaLista(alunniDaMostrare, dataOdierna, isDonMilani) {
    var area = document.getElementById('areaContenuto');

    if (alunniDaMostrare.length === 0) {
      area.innerHTML = '<div class="max-w-4xl mx-auto text-center text-gray-500 mt-12 text-lg">Nessun alunno trovato con i criteri di ricerca o filtro attivi.</div>';
      aggiornaBadgeRiepilogo();
      return;
    }

    var html = '<div class="max-w-4xl mx-auto">';
    if (dataOdierna) {
      html += '<div class="mb-3 text-sm text-gray-500 text-right font-medium">Data odierna: ' + dataOdierna + '</div>';
    }

    if (isDonMilani) {
      var gruppiClassi = {};
      alunniDaMostrare.forEach(function(alunno) {
        var classe = (alunno.valoreD || "Senza Classe").trim();
        if (!gruppiClassi[classe]) {
          gruppiClassi[classe] = [];
        }
        gruppiClassi[classe].push(alunno);
      });

      var classiOrdinate = Object.keys(gruppiClassi).sort();
      html += '<div class="space-y-4 pb-12">';
      
      classiOrdinate.forEach(function(classe, index) {
        var idClasseSafe = classe.replace(/[^a-zA-Z0-9]/g, '_');
        var isAperta = (index === 0);
        var displayStile = isAperta ? 'block' : 'hidden';
        var frecciaRotazione = isAperta ? 'transform rotate-180' : '';
        var alunniOrdinatiClasse = ordinaAlunniPerCognome(gruppiClassi[classe]);

        html += `
          <div class="border rounded-2xl bg-white shadow-sm overflow-hidden" id="sezione-classe-${idClasseSafe}">
            <div onclick="toggleClasse('${idClasseSafe}')" class="bg-blue-50 text-blue-900 font-bold px-5 py-4 text-base flex justify-between items-center cursor-pointer hover:bg-blue-100 transition select-none">
              <div class="flex items-center gap-3">
                <span>📚 Classe ${classe}</span>
                <span class="text-xs bg-white text-blue-700 px-2.5 py-1 rounded-full border border-blue-200">${alunniOrdinatiClasse.length} alunni</span>
              </div>
              <span id="freccia-${idClasseSafe}" class="text-blue-600 font-bold text-xl transition-transform duration-200 ${frecciaRotazione}">▼</span>
            </div>
            <div id="contenuto-classe-${idClasseSafe}" class="${displayStile} p-4 space-y-4 bg-gray-50 border-t">
        `;

        alunniOrdinatiClasse.forEach(function(alunno) {
          html += generaHtmlCardAlunno(alunno, true);
        });

        html += `
            </div>
          </div>
        `;
      });
      html += '</div>';
    } else {
      var alunniOrdinatiStandard = ordinaAlunniPerCognome(alunniDaMostrare);
      html += '<div class="space-y-4 pb-12">';
      alunniOrdinatiStandard.forEach(function(alunno) {
        html += generaHtmlCardAlunno(alunno, false);
      });
      html += '</div>';
    }

    html += '</div>';
    area.innerHTML = html;
    aggiornaBadgeRiepilogo();
}
function aggiornaBadgeRiepilogo() {
  if (typeof elencoAlunniGlobale === 'undefined' || !Array.isArray(elencoAlunniGlobale)) {
    return;
  }

  var presenti = 0;
  var assenti = 0;
  var daSegnare = 0;

  elencoAlunniGlobale.forEach(function(alunno) {
    var stato = String(alunno.stato || "").trim().toUpperCase();
    
    if (stato === 'P' || stato === 'PRESENTE') {
      presenti++;
    } else if (stato === 'A' || stato === 'ASSENTE') {
      assenti++;
    } else {
      daSegnare++;
    }
  });

  var badge = document.getElementById('badgeRiepilogo');
  if (badge) {
    badge.innerText = "P: " + presenti + " | A: " + assenti + " | Da segnare: " + daSegnare;
  }
}
  function toggleClasse(idClasseSafe) {
    var contenuto = document.getElementById('contenuto-classe-' + idClasseSafe);
    var freccia = document.getElementById('freccia-' + idClasseSafe);

    if (contenuto.classList.contains('hidden')) {
      contenuto.classList.remove('hidden');
      freccia.classList.add('rotate-180');
    } else {
      contenuto.classList.add('hidden');
      freccia.classList.remove('rotate-180');
    }
  }

  function generaHtmlCardAlunno(alunno, isDonMilani) {
    var isPresente = (alunno.stato === 'P' || alunno.stato === 'PRESENTE');
    var isAssente = (alunno.stato === 'A' || alunno.stato === 'ASSENTE');
    
    var classeCard = "p-4 sm:p-5 border rounded-2xl shadow-sm bg-white space-y-3.5 card-alunno";
    if (!isDonMilani && typeof alunno.ingressi === 'number' && alunno.ingressi <= 0) {
      classeCard += " border-red-400 bg-red-50";
    }

  var infoSecondaria = "";
    var tipoIscrizioneStr = String(alunno.tipo || "").toLowerCase();
    var eFisso = tipoIscrizioneStr.includes("fisso");

    if (isDonMilani) {
      infoSecondaria = alunno.tipo + ' • Classe: <span class="font-bold text-gray-700">' + (alunno.valoreD || '-') + '</span>';
    } else {
      // Mostra i residui solo se NON è un'iscrizione fissa e i residui sono diversi da '-'
      var mostraResidui = !eFisso && alunno.ingressi !== '-' && alunno.ingressi !== undefined;
      
      infoSecondaria = alunno.tipo + (mostraResidui ? ' • Residui: <span id="ingressi-' + alunno.riga + '" class="font-bold text-gray-700">' + alunno.ingressi + '</span>' : '');
    }

    var isServizioExtraAttivo = alunno.servizioExtra === true || alunno.servizioExtra === 'SI' || alunno.servizioExtra === 'true';

    // Gestione abilitazione campi extra in base alla presenza
    var statoDisabilitato = !isPresente ? 'disabled' : '';
    var stileDisabilitato = !isPresente ? 'opacity-50 cursor-not-allowed bg-gray-100' : 'bg-gray-50 cursor-pointer';

    // Verifica se il plesso corrente è Iqbal Masih
    var eIqbalMasih = typeof tabSelezionatoCorrente !== 'undefined' && 
                      tabSelezionatoCorrente && 
                      tabSelezionatoCorrente.toLowerCase().indexOf("iqbal") !== -1 && 
                      tabSelezionatoCorrente.toLowerCase().indexOf("masih") !== -1;

    // Genera il blocco extra solo per Iqbal Masih
    var htmlServizioExtra = "";
    if (eIqbalMasih) {
      htmlServizioExtra = `
        <div class="flex items-center justify-between gap-3 pt-1 border-t border-gray-100">
          <label id="label-servizio-${alunno.riga}" class="flex items-center gap-2 select-none text-xs sm:text-sm font-medium text-gray-700 ${!isPresente ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}">
            <input type="checkbox" id="servizio-extra-${alunno.riga}" ${isServizioExtraAttivo ? 'checked' : ''} ${statoDisabilitato} onchange="salvaDatiExtra(${alunno.riga})" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
            <span>Servizio Extra</span>
          </label>
          <div class="w-32">
            <input type="number" step="0.5" id="ore-extra-${alunno.riga}" value="${alunno.oreExtra || ''}" placeholder="Ore Extra" ${statoDisabilitato} onchange="salvaDatiExtra(${alunno.riga})" class="w-full px-3 py-2 text-xs sm:text-sm border border-gray-200 rounded-xl text-gray-700 ${stileDisabilitato} focus:bg-white focus:outline-none focus:ring-1 focus:ring-blue-600">
          </div>
        </div>
      `;
    }

    return `
      <div class="${classeCard}" id="card-${alunno.riga}" data-nome="${alunno.nome.toLowerCase()}">
        <div>
          <div class="flex justify-between items-start gap-2">
            <div class="font-bold text-gray-900 text-lg sm:text-xl leading-snug cursor-pointer hover:text-blue-700 transition py-0.5" onclick="apriStorico(${alunno.riga}, '${alunno.nome.replace(/'/g, "\\'")}')">
              ${alunno.nome} 🔍
            </div>
            <button onclick="apriDettagli(${alunno.riga}, '${alunno.nome.replace(/'/g, "\\'")}')" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1 shadow-sm shrink-0 active:scale-95">
              📋 Info
            </button>
          </div>
          <div class="text-xs sm:text-sm text-gray-500 mt-1">
            ${infoSecondaria}
          </div>
        </div>

        <div class="flex gap-3">
          <button onclick="registraStato(${alunno.riga}, 'P')" id="btn-p-${alunno.riga}" class="flex-1 py-3.5 sm:py-4 text-base font-bold rounded-xl transition active:scale-95 shadow-sm ${isPresente ? 'bg-green-600 text-white shadow-inner' : 'bg-gray-100 text-gray-700 hover:bg-green-100'}">
            Presente
          </button>
          <button onclick="registraStato(${alunno.riga}, 'A')" id="btn-a-${alunno.riga}" class="flex-1 py-3.5 sm:py-4 text-base font-bold rounded-xl transition active:scale-95 shadow-sm ${isAssente ? 'bg-red-600 text-white shadow-inner' : 'bg-gray-100 text-gray-700 hover:bg-red-100'}">
            Assente
          </button>
        </div>

        <div>
          <input type="text" id="nota-${alunno.riga}" value="${alunno.nota || ''}" placeholder="Aggiungi una nota..." onchange="salvaTestoNota(${alunno.riga})" class="w-full px-4 py-3 text-sm sm:text-base border border-gray-200 rounded-xl text-gray-700 bg-gray-50 focus:bg-white focus:outline-none focus:ring-1 focus:ring-blue-600">
        </div>

        ${htmlServizioExtra}
      </div>
    `;
}
  function registraStato(riga, statoScelto) {
  try {
    console.log("Inizio registraStato per riga:", riga, "stato:", statoScelto);
    
    var btnP = document.getElementById('btn-p-' + riga);
    var btnA = document.getElementById('btn-a-' + riga);
    
    var isGiàPresente = btnP && btnP.classList.contains('bg-green-600');
    var isGiàAssente = btnA && btnA.classList.contains('bg-red-600');

    var nuovoStato = statoScelto;
    if ((statoScelto === 'P' && isGiàPresente) || (statoScelto === 'A' && isGiàAssente)) {
      nuovoStato = "";
    }

    if (btnP && btnA) {
      btnP.className = "flex-1 py-3.5 sm:py-4 text-base font-bold rounded-xl transition active:scale-95 shadow-sm bg-gray-100 text-gray-700 hover:bg-green-100";
      btnA.className = "flex-1 py-3.5 sm:py-4 text-base font-bold rounded-xl transition active:scale-95 shadow-sm bg-gray-100 text-gray-700 hover:bg-red-100";

      if (nuovoStato === 'P') {
        btnP.className = "flex-1 py-3.5 sm:py-4 text-base font-bold rounded-xl transition active:scale-95 bg-green-600 text-white shadow-inner";
      } else if (nuovoStato === 'A') {
        btnA.className = "flex-1 py-3.5 sm:py-4 text-base font-bold rounded-xl transition active:scale-95 bg-red-600 text-white shadow-inner";
      }
    }

    // Gestione dinamica campi extra
    var checkServizio = document.getElementById('servizio-extra-' + riga);
    var inputOre = document.getElementById('ore-extra-' + riga);
    var labelServizio = document.getElementById('label-servizio-' + riga);

    if (checkServizio && inputOre && labelServizio) {
      if (nuovoStato === 'P') {
        checkServizio.disabled = false;
        inputOre.disabled = false;
        labelServizio.classList.remove('opacity-50', 'cursor-not-allowed');
        labelServizio.classList.add('cursor-pointer');
        inputOre.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-gray-100');
        inputOre.classList.add('bg-gray-50');
      } else {
        checkServizio.disabled = true;
        checkServizio.checked = false;
        inputOre.disabled = true;
        inputOre.value = "";
        labelServizio.classList.add('opacity-50', 'cursor-not-allowed');
        labelServizio.classList.remove('cursor-pointer');
        inputOre.classList.add('opacity-50', 'cursor-not-allowed', 'bg-gray-100');
        inputOre.classList.remove('bg-gray-50');

        if (typeof elencoAlunniGlobale !== 'undefined' && Array.isArray(elencoAlunniGlobale)) {
          var alunnoExtra = elencoAlunniGlobale.find(a => a.riga === riga);
          if (alunnoExtra) {
            alunnoExtra.servizioExtra = false;
            alunnoExtra.oreExtra = "";
          }
        }
        if (typeof tabSelezionatoCorrente !== 'undefined') {
          google.script.run.salvaExtra(tabSelezionatoCorrente, riga, false, "");
        }
      }
    }

    if (typeof elencoAlunniGlobale !== 'undefined' && Array.isArray(elencoAlunniGlobale)) {
      var alunnoTrovato = elencoAlunniGlobale.find(a => a.riga === riga);
      if (alunnoTrovato) {
        alunnoTrovato.stato = nuovoStato;
      }
    }
    
    if (typeof aggiornaBadgeRiepilogo === 'function') {
      aggiornaBadgeRiepilogo();
    }

    if (typeof aggiornaStatoSalvataggio === 'function') {
      aggiornaStatoSalvataggio('salvataggio', 'Salvataggio...');
    }
    
    if (typeof tabSelezionatoCorrente === 'undefined') {
      alert("Errore critico: tabSelezionatoCorrente non è definito.");
      return;
    }

    // Chiamata sicura al backend
    google.script.run
      .withSuccessHandler(function(risultato) {
        console.log("Successo backend:", risultato);
        if (typeof aggiornaStatoSalvataggio === 'function') {
          aggiornaStatoSalvataggio('ok', 'Sincronizzato');
        }
        var spanIngressi = document.getElementById('ingressi-' + riga);
        if (spanIngressi && risultato && risultato.nuoviIngressi !== undefined) {
          spanIngressi.innerText = risultato.nuoviIngressi;
          if (typeof elencoAlunniGlobale !== 'undefined') {
            var alunnoSync = elencoAlunniGlobale.find(a => a.riga === riga);
            if (alunnoSync) alunnoSync.ingressi = risultato.nuoviIngressi;
          }

          var card = document.getElementById('card-' + riga);
          if (card) {
            if (typeof risultato.nuoviIngressi === 'number' && risultato.nuoviIngressi <= 0) {
              card.classList.add('border-red-400', 'bg-red-50');
            } else {
              card.classList.remove('border-red-400', 'bg-red-50');
            }
          }
        }
      })
      .withFailureHandler(function(err) {
        console.error("Errore backend:", err);
        if (typeof aggiornaStatoSalvataggio === 'function') {
          aggiornaStatoSalvataggio('errore', 'Errore salvataggio');
        }
        alert("Errore durante il salvataggio: " + err.message);
      })
      .salvaPresenza(tabSelezionatoCorrente, riga, null, nuovoStato);

  } catch (e) {
    console.error("Errore JS intercettato in registraStato:", e);
    alert("Errore imprevisto nell'interfaccia: " + e.message);
  }
}

  function selezionaTutti(statoForzato) {
    if (!confirm(statoForzato === 'P' ? "Vuoi segnare TUTTI i bambini come presenti?" : "Vuoi azzerare tutte le presenze di oggi?")) {
      return;
    }
    elencoAlunniGlobale.forEach(function(alunno) {
      var btnP = document.getElementById('btn-p-' + alunno.riga);
      var isPresente = btnP && btnP.classList.contains('bg-green-600');
      if (statoForzato === 'P' && !isPresente) {
        registraStato(alunno.riga, 'P');
      } else if (statoForzato === '' && isPresente) {
        registraStato(alunno.riga, '');
      }
    });
  }

  function salvaTestoNota(riga) {
    var inputNota = document.getElementById('nota-' + riga);
    if (!inputNota) return;
    var testo = inputNota.value;

    var alunnoTrovato = elencoAlunniGlobale.find(a => a.riga === riga);
    if (alunnoTrovato) alunnoTrovato.nota = testo;

    aggiornaStatoSalvataggio('salvataggio', 'Salvataggio nota...');
    google.script.run
      .withSuccessHandler(function() {
        aggiornaStatoSalvataggio('ok', 'Sincronizzato');
        console.log("Nota salvata per la riga " + riga);
      })
      .withFailureHandler(function(err) {
        aggiornaStatoSalvataggio('errore', 'Errore nota');
        alert("Errore nel salvataggio della nota: " + err.message);
      })
      .salvaNota(tabSelezionatoCorrente, riga, testo);
  }
  function salvaDatiExtra(riga) {
    var checkServizio = document.getElementById('servizio-extra-' + riga);
    var inputOre = document.getElementById('ore-extra-' + riga);
    if (!checkServizio || !inputOre) return;

    var servizioExtra = checkServizio.checked; // Restituisce true o false
    var oreExtra = inputOre.value;

    // Aggiornamento locale dell'oggetto in memoria
    var alunnoTrovato = elencoAlunniGlobale.find(a => a.riga === riga);
    if (alunnoTrovato) {
      alunnoTrovato.servizioExtra = servizioExtra;
      alunnoTrovato.oreExtra = oreExtra;
    }

    aggiornaStatoSalvataggio('salvataggio', 'Salvataggio extra...');
    google.script.run
      .withSuccessHandler(function() {
        aggiornaStatoSalvataggio('ok', 'Sincronizzato');
        console.log("Dati extra salvati per la riga " + riga);
      })
      .withFailureHandler(function(err) {
        aggiornaStatoSalvataggio('errore', 'Errore extra');
        alert("Errore nel salvataggio dei dati extra: " + err.message);
      })
      .salvaExtra(tabSelezionatoCorrente, riga, servizioExtra, oreExtra);
  }
  function apriStorico(riga, nomeBambino) {
    var modale = document.getElementById('modaleStorico');
    var titolo = document.getElementById('modaleTitolo');
    var contenuto = document.getElementById('modaleContenuto');

    titolo.innerText = "Storico: " + nomeBambino;
    contenuto.innerHTML = '<div class="text-center text-blue-600 py-6 text-base">Caricamento presenze passate...</div>';
    modale.classList.remove('hidden');

    google.script.run
      .withSuccessHandler(function(risultato) {
        if (!risultato.giorni || risultato.giorni.length === 0) {
          contenuto.innerHTML = '<div class="text-center text-gray-500 py-6 text-sm">Nessuna presenza registrata in precedenza per questo mese.</div>';
          return;
        }

        function formattaData(dataStringa) {
          try {
            var d = new Date(dataStringa);
            if (isNaN(d.getTime())) return dataStringa;
            return d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
          } catch (e) {
            return dataStringa;
          }
        }

        var html = '<div class="text-sm font-semibold text-gray-500 mb-2.5">Iscrizione: <span class="text-gray-800">' + risultato.tipo + '</span> (Residui: <span class="text-gray-800 font-bold">' + risultato.ingressi + '</span>)</div>';
        html += '<div class="divide-y divide-gray-100 border rounded-2xl overflow-hidden">';
        
        risultato.giorni.forEach(function(item) {
          var coloreStato = item.stato === 'Presente' ? 'text-green-600 bg-green-50' : 'text-red-600 bg-red-50';
          var dataPulita = formattaData(item.data);
          dataPulita = dataPulita.charAt(0).toUpperCase() + dataPulita.slice(1);

          html += `
            <div class="flex justify-between items-center p-3.5 bg-white text-sm">
              <span class="font-medium text-gray-700">${dataPulita}</span>
              <span class="px-3 py-1 rounded-full text-xs font-bold ${coloreStato}">${item.stato}</span>
            </div>
          `;
        });
        html += '</div>';
        contenuto.innerHTML = html;
      })
      .withFailureHandler(function(err) {
        contenuto.innerHTML = '<div class="text-center text-red-500 py-4 text-sm">Errore nel caricamento dello storico: ' + err.message + '</div>';
      })
      .ottieniStoricoAlunno(tabSelezionatoCorrente, riga);
  }

  function chiudiStorico() {
    var modale = document.getElementById('modaleStorico');
    modale.classList.add('hidden');
  }

  // Funzione unificata per la navigazione tra le sezioni
function mostraSezione(tipo) {
  var vistaRegistro = document.getElementById('vistaRegistroAlunni');
  var sezioneTimbratura = document.getElementById('sezioneTimbratura');
  var footerRiepilogo = document.getElementById('footerRiepilogo');
  var btnRegistro = document.getElementById('btnTabRegistro');
  var btnTimbratura = document.getElementById('btnTabTimbratura');

  if (tipo === 'registro') {
    if (vistaRegistro) vistaRegistro.classList.remove('hidden');
    if (sezioneTimbratura) sezioneTimbratura.classList.add('hidden');
    if (footerRiepilogo) footerRiepilogo.classList.remove('hidden');
    
    // Stili bottoni header
    if (btnRegistro) {
      btnRegistro.className = "flex-1 sm:flex-none px-5 py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-white text-blue-800 shadow-md transition transform active:scale-95 flex items-center justify-center gap-2";
    }
    if (btnTimbratura) {
      btnTimbratura.className = "flex-1 sm:flex-none px-5 py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-blue-800/60 text-white hover:bg-blue-800 shadow-md transition transform active:scale-95 flex items-center justify-center gap-2";
    }

    if (typeof caricaSedi === 'function') caricaSedi();

  } else if (tipo === 'timbratura') {
    if (vistaRegistro) vistaRegistro.classList.add('hidden');
    if (sezioneTimbratura) {
      sezioneTimbratura.classList.remove('hidden');
      sezioneTimbratura.style.display = 'flex'; // Forza il flexbox
    }
    if (footerRiepilogo) footerRiepilogo.classList.add('hidden');

    // Stili bottoni header
    if (btnRegistro) {
      btnRegistro.className = "flex-1 sm:flex-none px-5 py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-blue-800/60 text-white hover:bg-blue-800 shadow-md transition transform active:scale-95 flex items-center justify-center gap-2";
    }
    if (btnTimbratura) {
      btnTimbratura.className = "flex-1 sm:flex-none px-5 py-2 rounded-xl text-xs sm:text-sm font-extrabold bg-white text-blue-800 shadow-md transition transform active:scale-95 flex items-center justify-center gap-2";
    }

    // Caricamento dei dati nei menu a tendina della timbratura
    caricaDatiInizialiTimbraturaCustom();
  }
}

// Funzione che chiama il backend Apps Script e popola i <select> della timbratura
function caricaDatiInizialiTimbraturaCustom() {
  var selOp = document.getElementById('selectOperatore');
  var selServ = document.getElementById('selectServizio');

  if (selOp) selOp.innerHTML = '<option value="">Caricamento operatori in corso...</option>';
  if (selServ) selServ.innerHTML = '<option value="">Caricamento servizi in corso...</option>';

  google.script.run
    .withSuccessHandler(function(dati) {
      // 1. Popola Operatori
      if (selOp) {
        selOp.innerHTML = '<option value="">-- Seleziona il tuo nome --</option>';
        if (dati && dati.operatori && dati.operatori.length > 0) {
          dati.operatori.forEach(function(op) {
            var opt = document.createElement('option');
            opt.value = op.nome;
            opt.textContent = op.nome + (op.mansioni ? ' (' + op.mansioni + ')' : '');
            selOp.appendChild(opt);
          });
        } else {
          selOp.innerHTML = '<option value="">Nessun operatore attivo trovato</option>';
        }
      }

      // 2. Popola Servizi (Plessi)
      if (selServ) {
        selServ.innerHTML = '<option value="">-- Seleziona il plesso/servizio --</option>';
        if (dati && dati.servizi && dati.servizi.length > 0) {
          dati.servizi.forEach(function(serv) {
            var opt = document.createElement('option');
            opt.value = serv.etichetta;
            opt.textContent = serv.etichetta;
            selServ.appendChild(opt);
          });
        } else {
          selServ.innerHTML = '<option value="">Nessun servizio trovato (PRESENZE_...)</option>';
        }
      }
    })
.withFailureHandler(function(err) {
      console.error("Errore nel caricamento dei dati di timbratura:", err);
      if (selOp) selOp.innerHTML = '<option value="">Errore caricamento operatori</option>';
      if (selServ) selServ.innerHTML = '<option value="">Errore caricamento servizi</option>';
    })
    .ottieniDatiInizialiTimbratura(); 
} // <-- Chiusura corretta della funzione precedente (es. caricaDatiInizialiTimbraturaCustom)
